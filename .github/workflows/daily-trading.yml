name: Daily Paper Trading

on:
  # 15:00 UTC = 10:00 ET (EDT) / 11:00 ET (EST) -- comfortably after the
  # 9:30 ET US market open in either daylight-saving state, since GitHub's
  # cron does not shift for DST.
  schedule:
    - cron: "0 15 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run strategy
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_PAPER: "true"
        run: python scripts/run_paper_trading.py
      - name: Commit tracked-position changes (if any)
        run: |
          git config user.name "trading-bot"
          git config user.email "actions@github.com"
          git add state/positions.json
          if ! git diff --cached --quiet; then
            git commit -m "Update tracked positions from daily run"
            git push
          else
            echo "No position changes to commit."
          fi

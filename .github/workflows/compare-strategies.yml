name: Compare Strategies

# On-demand comparison of all strategies across several historical market
# regimes (bull, bear, recovery, recent). No secrets needed.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python scripts/compare_strategies.py

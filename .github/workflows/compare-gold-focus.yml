name: Compare Gold Focus (temporary)

# One-off: compares a gold-only (GLD) portfolio against the current
# diversified watchlist and a stocks-only portfolio, same strategy/risk
# settings for all three. Requested ad hoc in chat -- not meant to stick
# around; delete this workflow and scripts/compare_gold_focus.py once done.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python scripts/compare_gold_focus.py

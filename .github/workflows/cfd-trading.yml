name: CFD Trading (Deriv)

# Runs the CFD/forex strategy every 20 minutes on weekdays. Forex/Deriv
# Multipliers trade ~24 hours a day Sunday evening through Friday evening
# UTC, so this misses a few hours at each end of that window (Mon-Fri
# only) -- a known simplification for now, not a full 24/5 schedule.
#
# Safety: unlike Alpaca/OANDA, Deriv doesn't have a separate practice/live
# base URL to force via an env var -- an API token is already scoped to
# whichever account (demo or real) it was created from. The actual safety
# check happens at runtime in broker.py's connect(): it reads the
# authorize response's is_virtual field and refuses a real account unless
# CFD_ALLOW_LIVE_TRADING is true. CFD_ALLOW_LIVE_TRADING is still hardcoded
# to "false" below as defense-in-depth, same protective intent as
# ALPACA_PAPER/OANDA_PRACTICE being hardcoded in the stock system's
# workflows -- so even a token for the wrong (real) account gets refused.
#
# UNTESTED end-to-end as of writing -- see src/trading/cfd/broker.py's
# docstring. Do not assume this works until it's been run against a real
# Deriv demo account and its logs checked.
#
# The "schedule" trigger below is commented out on purpose: with no
# DERIV_API_TOKEN secret set yet, a live cron would just fail every 20
# minutes and burn CI minutes on guaranteed failures. Trigger manually
# (workflow_dispatch) to validate against a real demo account first, then
# uncomment the schedule once that's confirmed working.
on:
  workflow_dispatch: {}
  # schedule:
  #   - cron: "7,27,47 * * * 1-5"

permissions:
  contents: write

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python scripts/run_cfd_trading.py
        env:
          DERIV_API_TOKEN: ${{ secrets.DERIV_API_TOKEN }}
          DERIV_APP_ID: "34riFtseEtSES06LjclCo"
          CFD_ALLOW_LIVE_TRADING: "false"
      - name: Commit state changes (if any)
        run: |
          git config user.name "trading-bot"
          git config user.email "actions@github.com"
          if [ -f state/cfd_bot_state.json ]; then
            git add state/cfd_bot_state.json
            if ! git diff --cached --quiet; then
              git commit -m "Update CFD bot state from scheduled run"
              git push
            else
              echo "No state changes to commit."
            fi
          else
            echo "No state file yet (read-only command, or first run never persisted one)."
          fi

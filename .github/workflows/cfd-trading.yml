name: CFD Trading (Deriv)

# Runs the CFD/forex strategy every 15 minutes on weekdays -- the
# candles it evaluates are still H1 (matching EmaCrossoverStrategy's
# granularity, see its docstring for why H1, not the originally-intended
# M15), so most runs inside the same still-open hour see an unchanged
# candle and act as a no-op re-check, not a new decision. What running
# more often than the candle itself actually buys (Revision 3 gap #3,
# docs/ARCHITECTURE_AUDIT.md's "decision cadence" half): a signal exit
# or a ratcheting trailing stop is caught within ~15 minutes of firing
# instead of waiting up to the rest of the hour, and a new entry into a
# slot freed up (or newly available -- see scheduler.py's per-strategy
# position slots) mid-hour doesn't sit idle until the next hourly mark.
# Never causes a duplicate decision on the same closed candle: nothing
# here re-evaluates a still-open position's own entry logic, and a flat
# instrument's entry decision is driven by the latest *completed* H1
# candle, unchanged however many times this workflow re-reads it before
# a new one closes. Forex/Deriv Multipliers trade ~24 hours a day Sunday
# evening through Friday evening UTC, so this misses a few hours at each
# end of that window (Mon-Fri only) -- a known simplification, not a
# full 24/5 schedule.
#
# Safety: unlike Alpaca/OANDA, Deriv doesn't have a separate practice/live
# base URL to force via an env var -- an API token is already scoped to
# whichever account (demo or real) it was created from. The actual safety
# check happens at runtime in broker.py's connect(): it picks the account
# whose account_type is "demo" and refuses a real account unless
# CFD_ALLOW_LIVE_TRADING is true. CFD_ALLOW_LIVE_TRADING is still hardcoded
# to "false" below as defense-in-depth, same protective intent as
# ALPACA_PAPER/OANDA_PRACTICE being hardcoded in the stock system's
# workflows -- so even a token for the wrong (real) account gets refused.
#
# Connection and order flow (connect, buy, portfolio read, sell) are
# confirmed end-to-end against a real Deriv demo account -- see
# src/trading/cfd/broker.py's docstring. Two manual (workflow_dispatch)
# runs against the real configured instruments (frxXAUUSD etc, not just
# a synthetic index) completed cleanly on 2026-09-19: first run recorded
# the virtual-equity baseline correctly (see trading.cfd.capital) and set
# the capital floor; second run made no unwanted state changes (baseline
# is set-once, as designed) and took no action (no ACTIVE strategy's
# suited_regimes matched at that moment -- a correct NO TRADE, not an
# error). No errors, no market-closed failures. Schedule enabled on that
# basis.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "*/15 * * * 1-5"

permissions:
  contents: write

# Serializes runs -- at 15-minute intervals, a run that's still going
# when the next one is due (a slow Deriv API response, a big candle
# fetch) would otherwise start a second scheduler.py process concurrently
# with the first. Idempotency (scheduler.py's set_pending_entry/
# _reconcile_unknown_positions) recovers attribution after ONE process
# crashing mid-run; it was never meant to arbitrate two processes racing
# to open the same order at once. queue (not cancel-in-progress) so a
# run already submitting orders is never killed mid-flight -- the next
# scheduled run just waits and starts once it's done.
concurrency:
  group: cfd-trading
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      # Pinned explicitly: a `schedule` trigger only ever fires the copy
      # of THIS FILE that lives on the repo's default branch, and with no
      # `ref` here `actions/checkout` would default to checking out that
      # same default branch's CODE too -- silently running stale, possibly
      # months-old application code on a real schedule, never this
      # actively-developed branch. Pinning ref here is what makes a
      # schedule-triggered run actually execute this project's current
      # code regardless of which branch's copy of the workflow file GitHub
      # used to fire it.
      - uses: actions/checkout@v4
        with:
          ref: claude/ai-trading-manager-deriv-pmay2v
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python scripts/run_cfd_trading.py
        env:
          DERIV_API_TOKEN: ${{ secrets.DERIV_API_TOKEN }}
          DERIV_APP_ID: "34riFtseEtSES06LjclCo"
          CFD_ALLOW_LIVE_TRADING: "false"
      - name: Commit state changes (if any)
        run: |
          git config user.name "trading-bot"
          git config user.email "actions@github.com"
          for f in state/cfd_bot_state.json state/cfd_trades.jsonl state/cfd_strategy_registry.json state/cfd_paper_trades.jsonl; do
            [ -f "$f" ] && git add "$f"
          done
          if ! git diff --cached --quiet; then
            git commit -m "Update CFD bot state from scheduled run"
            git push
          else
            echo "No state changes to commit."
          fi

name: CFD Trading (Deriv)

# Autonomous DEMO runner. The schedule follows the conservative XAUUSD
# trading window in UTC/GMT and stays out of the published daily break.
# The code/state source of truth for this handoff is pinned explicitly.
on:
  workflow_dispatch: {}
  push:
    branches:
      - gpt/autonomous-demo-runner
    paths:
      - state/cfd_trading_kick.txt
  schedule:
    # Sunday open: XAUUSD published open is 22:10 GMT.
    - cron: "15,30,45 22 * * 0"
    - cron: "*/15 23 * * 0"
    # Monday-Thursday, excluding the XAUUSD daily break around 20:59-22:05 GMT.
    - cron: "3,18,33,48 0-20 * * 1-4"
    - cron: "15,30,45 22 * * 1-4"
    - cron: "3,18,33,48 23 * * 1-4"
    # Friday through the published 20:45 GMT close.
    - cron: "3,18,33,48 0-20 * * 5"

permissions:
  contents: write

concurrency:
  group: cfd-trading
  cancel-in-progress: false

env:
  CFD_RUNTIME_REF: gpt/autonomous-demo-runner

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt/autonomous-demo-runner
          fetch-depth: 0

      - name: Mark scheduler started
        run: python3 scripts/cfd_scheduler_heartbeat.py started

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        id: deps
        run: pip install -r requirements.txt

      - name: Run deterministic CFD scheduler
        id: trade
        env:
          DERIV_API_TOKEN: ${{ secrets.DERIV_API_TOKEN }}
          DERIV_APP_ID: "34riFtseEtSES06LjclCo"
          CFD_ALLOW_LIVE_TRADING: "false"
        run: |
          python scripts/run_cfd_trading.py
          python -c "from trading.cfd.virtual_accounts import ensure_virtual_accounts; a=ensure_virtual_accounts(); print('VIRTUAL_ACCOUNTS='+str(len(a)))"

      - name: Mark scheduler completion
        if: always()
        env:
          DEPS_OUTCOME: ${{ steps.deps.outcome }}
          TRADE_OUTCOME: ${{ steps.trade.outcome }}
        run: |
          if [ "$DEPS_OUTCOME" = "success" ] && [ "$TRADE_OUTCOME" = "success" ]; then
            python3 scripts/cfd_scheduler_heartbeat.py success
          else
            python3 scripts/cfd_scheduler_heartbeat.py failure
          fi

      # IMPORTANT: persist local state even when the Python scheduler fails.
      # set_pending_entry() writes before broker submission; skipping this
      # commit on failure would throw away recovery metadata with the runner.
      - name: Persist scheduler state and heartbeat
        if: always()
        run: |
          git config user.name "trading-bot"
          git config user.email "actions@github.com"
          for f in \
            state/cfd_bot_state.json \
            state/cfd_trades.jsonl \
            state/cfd_strategy_registry.json \
            state/cfd_paper_trades.jsonl \
            state/cfd_decisions.jsonl \
            state/cfd_incidents.jsonl \
            state/cfd_lab_observations.jsonl \
            state/cfd_scheduler_heartbeat.json \
            state/cfd_micro_observations.jsonl \
            state/cfd_highrisk_observations.jsonl \
            state/cfd_virtual_account_ruin_log.jsonl; do
            [ -f "$f" ] && git add "$f"
          done
          if ! git diff --cached --quiet; then
            git commit -m "Update CFD runtime state from scheduled run"
            git pull --rebase origin gpt/autonomous-demo-runner
            git push origin HEAD:gpt/autonomous-demo-runner
          else
            echo "No runtime state changes to commit."
          fi

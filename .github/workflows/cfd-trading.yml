name: CFD Trading (Deriv)

# Autonomous DEMO runner. The schedule follows the conservative XAUUSD
# trading window in UTC/GMT and stays out of the published daily break.
# The code/state source of truth for this handoff is pinned explicitly.
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: [.github/workflows/cfd-trading.yml]
  schedule:
    # Sunday open: XAUUSD published open is 22:10 GMT.
    - cron: "15,45 22 * * 0"
    - cron: "*/30 23 * * 0"
    # Monday-Thursday, excluding the XAUUSD daily break around 20:59-22:05 GMT.
    - cron: "3,33 0-20 * * 1-4"
    - cron: "15,45 22 * * 1-4"
    - cron: "3,33 23 * * 1-4"
    # Friday through the published 20:45 GMT close.
    - cron: "3,33 0-20 * * 5"

permissions:
  contents: write

concurrency:
  group: cfd-trading
  cancel-in-progress: false

env:
  CFD_RUNTIME_REF: gpt/autonomous-demo-runner

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt/autonomous-demo-runner
          fetch-depth: 0

      - name: Mark scheduler started
        run: python3 scripts/cfd_scheduler_heartbeat.py started

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        id: deps
        run: pip install -r requirements.txt

      # 2026-09-24: was --minutes 180. The cron above already fires every
      # ~15 minutes during market hours; a 180-minute run meant this job
      # stayed "in_progress" almost continuously, so the concurrency group
      # (cfd-trading) queued essentially every scheduled tick behind
      # whichever run was already active. schedule: is documented as
      # best-effort and can be delayed under load -- this repo's own
      # scheduled events (this workflow, the watchdog, and the probe) went
      # silent for ~4.5 hours while push/workflow_dispatch kept working
      # normally, consistent with GitHub deprioritizing a workflow that
      # looks perpetually busy.
      #
      # 2026-09-25: 12 minutes (the first fix) turned out to still be too
      # tight. The job itself reliably finishes in its budget (confirmed via
      # the jobs API: exactly 12m00s of "Run checkpointed DEMO service"),
      # but the *run* was repeatedly observed sitting queued for up to ~10
      # minutes before a runner started it, because a workflow_dispatch
      # pulse (used as a stopgap while schedule: was silent) and the
      # schedule: cron share this same concurrency group. With only ~2.5
      # minutes of margin under the 15-minute cadence, any overlapping
      # dispatch reliably pushed the next tick into a queued wait long
      # enough to look like another multi-tick backlog to GitHub. 8 minutes
      # leaves a much wider real margin so an occasional overlap no longer
      # chains into that pattern.
      #
      # 2026-09-25 (later): root cause was actually account-level Actions
      # minutes/spending-limit exhaustion (runner_id: 0 on every failed job,
      # confirmed via billing). Cron cadence above was halved (~15min ->
      # ~30min ticks) to reduce minutes consumption independent of the
      # repo-visibility fix.
      - name: Run checkpointed DEMO service
        id: trade
        env:
          DERIV_API_TOKEN: ${{ secrets.DERIV_API_TOKEN }}
          DERIV_APP_ID: "34riFtseEtSES06LjclCo"
          CFD_ALLOW_LIVE_TRADING: "false"
          CFD_MAX_OPEN_POSITIONS: "5"
        run: python scripts/run_cfd_service.py --minutes 8

      # IMPORTANT: persist local state even when the Python scheduler fails.
      # set_pending_entry() writes before broker submission; skipping this
      # commit on failure would throw away recovery metadata with the runner.
      - name: Archive runtime state before publishing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cfd-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            state/cfd_*.json
            state/cfd_*.jsonl
            state/cfd_quota_events.jsonl
          retention-days: 14
          if-no-files-found: warn

      - name: Persist scheduler state and heartbeat
        if: always()
        run: |
          git config user.name "trading-bot"
          git config user.email "actions@github.com"
          # Include all runtime ledgers and observations, not a partial list.
          # This includes state/cfd_scheduler_heartbeat.json.
          git add -u -- state
          for f in state/cfd_*.json state/cfd_*.jsonl; do
            if [ -f "$f" ]; then git add -- "$f"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "Update CFD runtime state from scheduled run"
            git pull --rebase origin gpt/autonomous-demo-runner
            git push origin HEAD:gpt/autonomous-demo-runner
          else
            echo "No runtime state changes to commit."
          fi

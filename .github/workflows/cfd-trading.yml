name: CFD Trading (Deriv)

# Runs the CFD/forex strategy roughly hourly on weekdays, matching
# EmaCrossoverStrategy's H1 granularity (see its docstring for why H1,
# not the originally-intended M15). Forex/Deriv Multipliers trade ~24
# hours a day Sunday evening through Friday evening UTC, so this misses
# a few hours at each end of that window (Mon-Fri only) -- a known
# simplification, not a full 24/5 schedule.
#
# Safety: unlike Alpaca/OANDA, Deriv doesn't have a separate practice/live
# base URL to force via an env var -- an API token is already scoped to
# whichever account (demo or real) it was created from. The actual safety
# check happens at runtime in broker.py's connect(): it picks the account
# whose account_type is "demo" and refuses a real account unless
# CFD_ALLOW_LIVE_TRADING is true. CFD_ALLOW_LIVE_TRADING is still hardcoded
# to "false" below as defense-in-depth, same protective intent as
# ALPACA_PAPER/OANDA_PRACTICE being hardcoded in the stock system's
# workflows -- so even a token for the wrong (real) account gets refused.
#
# Connection and order flow (connect, buy, portfolio read, sell) are
# confirmed end-to-end against a real Deriv demo account -- see
# src/trading/cfd/broker.py's docstring. Still not yet confirmed: placing
# a real order on the actual configured instruments (frxXAUUSD etc,
# rather than a synthetic index used for the connection test) -- blocked
# by forex/gold markets being closed over a weekend when that was last
# attempted. The "schedule" trigger stays commented out until that's
# checked -- a live cron against instruments that might reject the
# trade would just fail every run and burn CI minutes on a guaranteed
# failure. Trigger manually (workflow_dispatch) to confirm first, then
# uncomment the schedule.
on:
  workflow_dispatch: {}
  # schedule:
  #   - cron: "5 * * * 1-5"

permissions:
  contents: write

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python scripts/run_cfd_trading.py
        env:
          DERIV_API_TOKEN: ${{ secrets.DERIV_API_TOKEN }}
          DERIV_APP_ID: "34riFtseEtSES06LjclCo"
          CFD_ALLOW_LIVE_TRADING: "false"
          CFD_VIRTUAL_STARTING_CAPITAL: "100"
          CFD_MAX_ACCOUNT_DRAWDOWN_PCT: "0.20"
      - name: Commit state changes (if any)
        run: |
          git config user.name "trading-bot"
          git config user.email "actions@github.com"
          if [ -f state/cfd_bot_state.json ]; then
            git add state/cfd_bot_state.json
            if ! git diff --cached --quiet; then
              git commit -m "Update CFD bot state from scheduled run"
              git push
            else
              echo "No state changes to commit."
            fi
          else
            echo "No state file yet (read-only command, or first run never persisted one)."
          fi

name: GPT Handoff CI

on:
  pull_request:
    branches:
      - gpt/deriv-demo-bridge
  workflow_dispatch: {}
  push:
    branches:
      - gpt/autonomous-demo-runner
    paths:
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/gpt-handoff-ci.yml"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pytest -q

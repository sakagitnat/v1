name: CFD Manual Command (Deriv)

# Triggered on demand -- normally by Claude, via the GitHub Actions API,
# when you ask for something in chat about the CFD/forex bot. Can also be
# run by hand from the Actions tab.
#
# Safety: CFD_ALLOW_LIVE_TRADING is hardcoded to "false" below regardless
# of any secret, as defense-in-depth -- see cfd-trading.yml's comment for
# why Deriv's account model needs a different safety check than Alpaca/
# OANDA's practice/live URL switch (the real check is broker.py's
# is_virtual check at connect time).
on:
  workflow_dispatch:
    inputs:
      command:
        description: "What to do"
        required: true
        type: choice
        options: [status, performance, failures, list-strategies, promote-strategy, pause, resume, exclude-instrument, include-instrument, test-order, close-position, optimize-strategy, sweep-risk, list-symbols, backtest-crypto, sweep-risk-synthetic, optimize-breakout, sweep-risk-breakout]
      instrument:
        description: "Instrument (required for exclude-instrument/include-instrument; optional for test-order, e.g. frxXAUUSD). For close-position, put the contract_id here instead. For optimize-strategy/sweep-risk, put the history source here instead: deriv or yfinance. For list-symbols, put the filter substring here instead (e.g. crypto or BTC)."
        required: false
        type: string
      reason:
        description: "Why (optional, for pause/exclude-instrument; REQUIRED for promote-strategy)"
        required: false
        type: string
      strategy_name:
        description: "For promote-strategy only: registered strategy name, e.g. ema_crossover"
        required: false
        type: string
      strategy_version:
        description: "For promote-strategy only: registered version, e.g. v1"
        required: false
        type: string
      strategy_state:
        description: "For promote-strategy only: target lifecycle state"
        required: false
        type: choice
        options: [RESEARCH, CANDIDATE, VALIDATED, PAPER, ACTIVE, PAUSED, RETIRED]
        default: RESEARCH
      side:
        description: "For test-order only: long or short"
        required: false
        type: choice
        options: [long, short]
        default: long
      multiplier:
        description: "For test-order: Deriv caps which multipliers are offered per instrument -- override if 20 isn't accepted. For optimize-strategy/sweep-risk: reused as the candle granularity in seconds (e.g. 3600 for hourly)."
        required: false
        type: string
        default: "20"

permissions:
  contents: write

jobs:
  run-command:
    runs-on: ubuntu-latest
    timeout-minutes: 20  # optimize-strategy/sweep-risk grid searches can take a few minutes; everything else finishes in well under one
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run command
        env:
          DERIV_API_TOKEN: ${{ secrets.DERIV_API_TOKEN }}
          DERIV_APP_ID: "34riFtseEtSES06LjclCo"
          CFD_ALLOW_LIVE_TRADING: "false"
          CMD: ${{ inputs.command }}
          INSTRUMENT: ${{ inputs.instrument }}
          REASON: ${{ inputs.reason }}
          SIDE: ${{ inputs.side }}
          MULTIPLIER: ${{ inputs.multiplier }}
          STRATEGY_NAME: ${{ inputs.strategy_name }}
          STRATEGY_VERSION: ${{ inputs.strategy_version }}
          STRATEGY_STATE: ${{ inputs.strategy_state }}
        run: |
          set -e
          case "$CMD" in
            status|resume|performance|failures|list-strategies)
              python scripts/cfd_cli.py "$CMD"
              ;;
            promote-strategy)
              python scripts/cfd_cli.py promote-strategy "$STRATEGY_NAME" "$STRATEGY_VERSION" "$STRATEGY_STATE" --reason "$REASON"
              ;;
            pause)
              python scripts/cfd_cli.py pause --reason "$REASON"
              ;;
            exclude-instrument)
              python scripts/cfd_cli.py exclude-instrument "$INSTRUMENT" --reason "$REASON"
              ;;
            include-instrument)
              python scripts/cfd_cli.py include-instrument "$INSTRUMENT"
              ;;
            test-order)
              ARGS="--side ${SIDE:-long} --multiplier ${MULTIPLIER:-20}"
              if [ -n "$INSTRUMENT" ]; then ARGS="$ARGS --instrument $INSTRUMENT"; fi
              python scripts/cfd_cli.py test-order $ARGS
              ;;
            close-position)
              python scripts/cfd_cli.py close-position "$INSTRUMENT"
              ;;
            optimize-strategy)
              python scripts/optimize_cfd_strategy.py --granularity "${MULTIPLIER:-900}" --source "${INSTRUMENT:-deriv}"
              ;;
            sweep-risk)
              python scripts/sweep_cfd_risk.py --granularity "${MULTIPLIER:-3600}" --source "${INSTRUMENT:-yfinance}"
              ;;
            list-symbols)
              python scripts/cfd_cli.py list-symbols --filter "$INSTRUMENT"
              ;;
            backtest-crypto)
              python scripts/backtest_crypto.py --granularity "${MULTIPLIER:-3600}"
              ;;
            sweep-risk-synthetic)
              python scripts/sweep_cfd_risk_synthetic.py --granularity "${MULTIPLIER:-3600}"
              ;;
            optimize-breakout)
              python scripts/optimize_cfd_breakout.py --granularity "${MULTIPLIER:-3600}" --source "${INSTRUMENT:-yfinance}"
              ;;
            sweep-risk-breakout)
              python scripts/sweep_cfd_risk_breakout.py --granularity "${MULTIPLIER:-3600}" --source "${INSTRUMENT:-yfinance}"
              ;;
            *)
              echo "Unknown command: $CMD" >&2
              exit 1
              ;;
          esac
      - name: Commit state changes (if any)
        run: |
          git config user.name "trading-bot"
          git config user.email "actions@github.com"
          for f in state/cfd_bot_state.json state/cfd_trades.jsonl state/cfd_strategy_registry.json; do
            [ -f "$f" ] && git add "$f"
          done
          if ! git diff --cached --quiet; then
            git commit -m "Update CFD bot state via manual command: ${{ inputs.command }}"
            git push
          else
            echo "No state changes to commit."
          fi

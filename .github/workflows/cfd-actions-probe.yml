name: CFD Actions Schedule Probe

# 2026-09-24: was */10 (every 10 minutes, forever). A pure diagnostic
# ping run this often, continuously, is itself an unusually heavy
# schedule footprint for one repository -- plausibly contributing to
# GitHub deprioritizing this repo's own schedule: event delivery (see
# cfd-trading.yml's matching comment). Hourly is still enough to notice
# a real scheduling outage without adding to the load that likely
# caused this one.
#
# 2026-09-24 (later same day): cron was "0 * * * *" -- exactly the top
# of every hour, which GitHub's own docs single out: "High load times
# include the start of each hour" for schedule: delivery delay. Offset
# to :22 so this doesn't queue behind that spike, matching the same
# reasoning already applied to cfd-trading.yml (3,18,33,48) and
# cfd-trading-watchdog.yml (7,37) -- neither of which sits on :00/:30.
on:
  workflow_dispatch: {}
  push:
    branches:
      - gpt/autonomous-demo-runner
    paths:
      - state/cfd_probe_kick.txt
  schedule:
    - cron: "22 * * * *"

permissions:
  contents: write

concurrency:
  group: cfd-actions-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt/autonomous-demo-runner
          fetch-depth: 0

      - name: Write schedule probe
        env:
          RUN_ID: ${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          p = Path("state/cfd_actions_probe.json")
          p.parent.mkdir(parents=True, exist_ok=True)
          p.write_text(json.dumps({
              "timestamp": datetime.now(timezone.utc).isoformat(),
              "run_id": os.environ.get("RUN_ID"),
              "event_name": os.environ.get("EVENT_NAME"),
          }, indent=2) + "\n")
          PY

      - name: Persist probe
        run: |
          git config user.name "trading-bot"
          git config user.email "actions@github.com"
          git add state/cfd_actions_probe.json
          git commit -m "Update CFD Actions schedule probe"
          git pull --rebase origin gpt/autonomous-demo-runner
          git push origin HEAD:gpt/autonomous-demo-runner

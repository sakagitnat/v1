name: Backtest

# On-demand backtest of the strategy over the configured watchlist. No
# secrets needed -- historical price data comes free from yfinance.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python scripts/run_backtest.py
